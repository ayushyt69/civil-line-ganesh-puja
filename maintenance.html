<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Website Under Maintenance — Civil Line Ganesh Puja Samiti</title>

  <style>

    /* ============================= */
    /* BASIC RESET */
    /* ============================= */

    *{
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;

      font-family:Arial,sans-serif;
      color:#fff;

      overflow:hidden;
      position:relative;

      background:
        radial-gradient(
          circle at 18% 18%,
          rgba(214,168,63,.30),
          transparent 27%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(197,31,50,.35),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #240812,
          #4b0d1c 50%,
          #18050d
        );
    }


    /* ============================= */
    /* BACKGROUND GLOW */
    /* ============================= */

    .glow{
      position:fixed;

      width:300px;
      height:300px;

      border-radius:50%;

      filter:blur(65px);

      opacity:.45;

      pointer-events:none;

      animation:glowMove 9s ease-in-out infinite alternate;
    }

    .glow.one{
      background:#d6a83f;

      top:-120px;
      left:-100px;
    }

    .glow.two{
      background:#d62828;

      right:-120px;
      bottom:-120px;

      animation-delay:2s;
    }

    @keyframes glowMove{

      0%{
        transform:translate(0,0) scale(1);
      }

      50%{
        transform:translate(45px,25px) scale(1.15);
      }

      100%{
        transform:translate(-20px,50px) scale(.9);
      }

    }


    /* ============================= */
    /* FLOATING PARTICLES */
    /* ============================= */

    .particle{
      position:fixed;

      width:5px;
      height:5px;

      border-radius:50%;

      background:#f6d575;

      opacity:.7;

      pointer-events:none;

      animation:particleFloat linear infinite;
    }

    .p1{
      left:12%;
      bottom:-20px;
      animation-duration:7s;
    }

    .p2{
      left:30%;
      bottom:-30px;
      animation-duration:9s;
      animation-delay:2s;
    }

    .p3{
      left:68%;
      bottom:-20px;
      animation-duration:8s;
      animation-delay:1s;
    }

    .p4{
      left:86%;
      bottom:-30px;
      animation-duration:10s;
      animation-delay:3s;
    }

    .p5{
      left:50%;
      bottom:-20px;
      animation-duration:11s;
      animation-delay:4s;
    }

    @keyframes particleFloat{

      0%{
        transform:translateY(0) scale(.5);
        opacity:0;
      }

      15%{
        opacity:.8;
      }

      75%{
        opacity:.6;
      }

      100%{
        transform:translateY(-110vh) scale(1.2);
        opacity:0;
      }

    }


    /* ============================= */
    /* MAIN MAINTENANCE CARD */
    /* ============================= */

    .maintenance-card{
      width:100%;
      max-width:600px;

      padding:48px 30px 30px;

      text-align:center;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.14),
          rgba(255,255,255,.05)
        );

      border:1px solid rgba(246,213,117,.60);

      border-radius:28px;

      box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.15);

      backdrop-filter:blur(18px);

      position:relative;

      z-index:2;

      animation:cardEnter 1s cubic-bezier(.17,.89,.32,1.28);
    }

    @keyframes cardEnter{

      0%{
        opacity:0;
        transform:
          translateY(60px)
          scale(.78)
          rotateX(12deg);
      }

      70%{
        transform:
          translateY(-8px)
          scale(1.02);
      }

      100%{
        opacity:1;
        transform:
          translateY(0)
          scale(1)
          rotateX(0);
      }

    }


    /* ============================= */
    /* LOGO */
    /* ============================= */

    .logo-wrap{
      width:150px;
      height:150px;

      margin:0 auto 22px;

      position:relative;

      display:flex;
      align-items:center;
      justify-content:center;
    }


    /* Main rotating circle */

    .logo-ring{
      position:absolute;

      width:132px;
      height:132px;

      border-radius:50%;

      border:1px solid rgba(246,213,117,.65);

      animation:ringRotate 9s linear infinite;

      box-shadow:
        0 0 18px rgba(246,213,117,.10);
    }


    /* Small moving point on ring */

    .logo-ring::before{
      content:"";

      position:absolute;

      width:11px;
      height:11px;

      border-radius:50%;

      background:#f6d575;

      top:-6px;
      left:50%;

      transform:translateX(-50%);

      box-shadow:
        0 0 18px #f6d575;
    }


    /* Second subtle circle */

    .logo-ring::after{
      content:"";

      position:absolute;

      inset:9px;

      border-radius:50%;

      border:1px solid rgba(246,213,117,.18);
    }


    @keyframes ringRotate{

      from{
        transform:rotate(0deg);
      }

      to{
        transform:rotate(360deg);
      }

    }


    /* Actual logo */

    .logo{
      width:108px;
      height:108px;

      object-fit:cover;

      border-radius:50%;

      position:relative;

      z-index:2;

      background:#fff;

      border:3px solid rgba(246,213,117,.85);

      box-shadow:
        0 8px 25px rgba(0,0,0,.40),
        0 0 25px rgba(246,213,117,.15);

      animation:logoFloat 3.5s ease-in-out infinite;
    }

    @keyframes logoFloat{

      0%,
      100%{
        transform:translateY(0) scale(1);
      }

      50%{
        transform:translateY(-8px) scale(1.035);
      }

    }


    /* ============================= */
    /* TEXT */
    /* ============================= */

    .tag{
      color:#f6d575;

      font-weight:bold;

      font-size:13px;

      letter-spacing:3px;

      text-transform:uppercase;

      margin-bottom:12px;
    }

    h1{
      margin:0 0 12px;

      color:#fff;

      font-size:36px;

      line-height:1.15;

      text-shadow:
        0 0 18px rgba(246,213,117,.18);

      animation:textReveal .9s ease-out .35s both;
    }

    h2{
      margin:0 0 20px;

      color:#f6d575;

      font-size:22px;

      animation:textReveal .9s ease-out .5s both;
    }

    p{
      margin:10px auto;

      max-width:480px;

      line-height:1.7;

      color:rgba(255,255,255,.78);

      font-size:16px;

      animation:textReveal .9s ease-out .65s both;
    }

    @keyframes textReveal{

      from{
        opacity:0;
        transform:translateY(15px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }


    /* ============================= */
    /* STATUS */
    /* ============================= */

    .status{
      margin:26px auto 0;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:9px;

      color:rgba(255,255,255,.65);

      font-size:13px;

      animation:textReveal .9s ease-out .8s both;
    }

    .status-dot{
      width:8px;
      height:8px;

      border-radius:50%;

      background:#f6d575;

      box-shadow:
        0 0 0 0 rgba(246,213,117,.6);

      animation:pulse 1.8s infinite;
    }

    @keyframes pulse{

      0%{
        box-shadow:
          0 0 0 0
          rgba(246,213,117,.6);
      }

      70%{
        box-shadow:
          0 0 0 10px
          rgba(246,213,117,0);
      }

      100%{
        box-shadow:
          0 0 0 0
          rgba(246,213,117,0);
      }

    }


    /* ============================= */
    /* DEVELOPER */
    /* ============================= */

    .developer{
      margin-top:30px;

      padding-top:20px;

      border-top:
        1px solid rgba(255,255,255,.12);

      color:rgba(255,255,255,.55);

      font-size:13px;

      animation:textReveal .9s ease-out .9s both;
    }

    .developer strong{
      color:#f6d575;
    }


    /* ============================= */
    /* MOBILE */
    /* ============================= */

    @media(max-width:500px){

      body{
        padding:15px;
      }

      .maintenance-card{
        padding:38px 20px 25px;

        border-radius:24px;
      }

      .logo-wrap{
        width:135px;
        height:135px;

        margin-bottom:20px;
      }

      .logo-ring{
        width:120px;
        height:120px;
      }

      .logo{
        width:94px;
        height:94px;
      }

      h1{
        font-size:29px;
      }

      h2{
        font-size:20px;
      }

      p{
        font-size:15px;
      }

      .tag{
        font-size:11px;
        letter-spacing:2px;
      }

    }

  </style>

</head>


<body>

  <!-- ============================= -->
  <!-- BACKGROUND EFFECTS -->
  <!-- ============================= -->

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>


  <!-- ============================= -->
  <!-- MAINTENANCE CARD -->
  <!-- ============================= -->

  <div class="maintenance-card">


    <!-- ============================= -->
    <!-- LOGO -->
    <!-- ============================= -->

    <div class="logo-wrap">

      <div class="logo-ring"></div>

      <img
        src="assets/IMG_20260916_020908.png"
        alt="Civil Line Ganesh Puja Samiti logo"
        class="logo"
      >

    </div>


    <!-- ============================= -->
    <!-- WEBSITE INFORMATION -->
    <!-- ============================= -->

    <div class="tag">
      Civil Line Ganesh Puja Samiti
    </div>

    <h1>
      Website Under Maintenance
    </h1>

    <h2>
      We'll Be Back Soon
    </h2>

    <p>
      Our website is currently being updated and improved.
      Please check back shortly.
    </p>


    <!-- ============================= -->
    <!-- STATUS -->
    <!-- ============================= -->

    <div class="status">

      <span class="status-dot"></span>

      <span>
        Something special is being prepared
      </span>

    </div>


    <!-- ============================= -->
    <!-- DEVELOPER -->
    <!-- ============================= -->

    <div class="developer">

      Maintained by
      <strong>Ayush Khaware</strong>

    </div>


  </div>

</body>
</html>
