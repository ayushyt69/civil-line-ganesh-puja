
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Website Under Maintenance — Civil Line Ganesh Puja Samiti</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#fffaf0;
      color:#222;
    }

    .maintenance-card{
      width:100%;
      max-width:600px;
      padding:45px 30px;
      text-align:center;
      background:#ffffff;
      border-radius:22px;
      border:2px solid #d62828;
      box-shadow:0 15px 50px rgba(0,0,0,.12);
    }

    .logo{
      width:110px;
      height:110px;
      object-fit:contain;
      margin-bottom:20px;
    }

    .tag{
      color:#b8860b;
      font-weight:bold;
      font-size:14px;
      letter-spacing:1px;
      text-transform:uppercase;
      margin-bottom:10px;
    }

    h1{
      margin:0 0 15px;
      color:#8e1424;
      font-size:34px;
    }

    h2{
      margin:0 0 20px;
      font-size:22px;
      color:#333;
    }

    p{
      margin:10px auto;
      max-width:480px;
      line-height:1.7;
      color:#666;
      font-size:16px;
    }

    .developer{
      margin-top:30px;
      padding-top:20px;
      border-top:1px solid #eee;
      color:#555;
      font-size:14px;
    }

    .developer strong{
      color:#8e1424;
    }

    @media(max-width:500px){
      .maintenance-card{
        padding:35px 20px;
      }

      .logo{
        width:90px;
        height:90px;
      }

      h1{
        font-size:28px;
      }

      h2{
        font-size:20px;
      }
    }
  </style>
</head>

<body>

  <div class="maintenance-card">

    <img
      src="assets/IMG_20260916_020908.png"
      alt="Civil Line Ganesh Puja Samiti logo"
      class="logo"
    >

    <div class="tag">
      Civil Line Ganesh Puja Samiti
    </div>

    <h1>Website Under Maintenance</h1>

    <h2>We'll Be Back Soon</h2>

    <p>
      Our website is currently being updated and improved.
      Please check back shortly.
    </p>

    <div class="developer">
      Maintained by <strong>Ayush Khaware</strong>
    </div>

  </div>

</body>
</html>
