<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2026 Ganesh Puja — Event Gallery</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf0;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 35px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .gallery-grid img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.02);
    }

    .loading {
      text-align: center;
      color: #666;
      margin: 40px 0;
    }

    .error {
      text-align: center;
      color: #c62828;
      margin: 40px 0;
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 35px auto 0;
      padding: 12px 22px;
      background: #d62828;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>2026 Ganesh Puja — Event Gallery</h1>

    <p class="subtitle">
      Memories from our Ganesh Puja celebrations
    </p>

    <div id="event-gallery" class="gallery-grid">
      <p class="loading">Loading photos...</p>
    </div>

    <a href="index.html" class="back-button">
      Back to Home
    </a>

  </div>

  <script>
    const gallery = document.getElementById("event-gallery");

    // Automatically detect your GitHub username
    // from the GitHub Pages website address.
    const githubUsername = window.location.hostname.split(".")[0];

    const repoName = "civil-line-ganesh-puja";

    const apiUrl =
      `https://api.github.com/repos/${githubUsername}/${repoName}/contents/assets/gallery`;

    fetch(apiUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load gallery photos.");
        }

        return response.json();
      })

      .then(files => {

        gallery.innerHTML = "";

        const imageFiles = files.filter(file =>
          file.type === "file" &&
          /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
        );

        if (imageFiles.length === 0) {
          gallery.innerHTML =
            '<p class="loading">No photos uploaded yet.</p>';
          return;
        }

        imageFiles.forEach(file => {

          const img = document.createElement("img");

          img.src = file.download_url;

          img.alt = "2026 Ganesh Puja event photo";

          img.loading = "lazy";

          img.decoding = "async";

          gallery.appendChild(img);
        });
      })

      .catch(error => {

        console.error(error);

        gallery.innerHTML =
          '<p class="error">Unable to load photos. Please try again later.</p>';

      });
  </script>

</body>
</html>
