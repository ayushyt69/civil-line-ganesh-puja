<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2026 Ganesh Puja — Event Gallery</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf0;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 35px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .gallery-grid img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.02);
    }

    .loading {
      text-align: center;
      color: #666;
      margin: 40px 0;
    }

    .error {
      text-align: center;
      color: #c62828;
      margin: 40px 0;
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 35px auto 0;
      padding: 12px 22px;
      background: #d62828;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>2026 Ganesh Puja — Event Gallery</h1>

    <p class="subtitle">
      Memories from our Ganesh Puja celebrations
    </p>

    <div id="event-gallery" class="gallery-grid">
      <p class="loading">Loading photos...</p>
    </div>

<div
  id="lightbox"
  style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
  "
>
  <button
    id="lightbox-close"
    style="
      position:absolute;
      top:18px;
      right:22px;
      background:none;
      border:none;
      color:white;
      font-size:36px;
      cursor:pointer;
      z-index:10001;
    "
    aria-label="Close"
  >
    ×
  </button>

  <button
    id="lightbox-prev"
    style="
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      background:rgba(255,255,255,0.15);
      border:none;
      color:white;
      font-size:34px;
      width:50px;
      height:60px;
      border-radius:10px;
      cursor:pointer;
      z-index:10001;
    "
    aria-label="Previous photo"
  >
    ‹
  </button>

  <img
    id="lightbox-image"
    src=""
    alt="Expanded Ganesh Puja event photo"
    style="
      max-width:90%;
      max-height:90%;
      object-fit:contain;
      border-radius:12px;
    "
  >

  <button
    id="lightbox-next"
    style="
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      background:rgba(255,255,255,0.15);
      border:none;
      color:white;
      font-size:34px;
      width:50px;
      height:60px;
      border-radius:10px;
      cursor:pointer;
      z-index:10001;
    "
    aria-label="Next photo"
  >
    ›
  </button>
</div>
    
    <a href="index.html" class="back-button">
      Back to Home
    </a>

  </div>

  <script>
    const gallery = document.getElementById("event-gallery");

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightbox-image");
const lightboxClose = document.getElementById("lightbox-close");
const lightboxPrev = document.getElementById("lightbox-prev");
const lightboxNext = document.getElementById("lightbox-next");

let currentPhotoIndex = 0;
let galleryImages = [];

function openLightbox(index) {
  galleryImages = Array.from(
    document.querySelectorAll("#event-gallery img")
  );

  if (!galleryImages.length) return;

  currentPhotoIndex = index;
  lightboxImage.src = galleryImages[currentPhotoIndex].src;
  lightbox.style.display = "flex";
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  lightbox.style.display = "none";
  document.body.style.overflow = "";
}

function showPreviousPhoto() {
  if (!galleryImages.length) return;

  currentPhotoIndex =
    (currentPhotoIndex - 1 + galleryImages.length) %
    galleryImages.length;

  lightboxImage.src = galleryImages[currentPhotoIndex].src;
}

function showNextPhoto() {
  if (!galleryImages.length) return;

  currentPhotoIndex =
    (currentPhotoIndex + 1) %
    galleryImages.length;

  lightboxImage.src = galleryImages[currentPhotoIndex].src;
}

lightboxClose.addEventListener("click", closeLightbox);

lightboxPrev.addEventListener("click", showPreviousPhoto);

lightboxNext.addEventListener("click", showNextPhoto);

lightbox.addEventListener("click", function(event) {
  if (event.target === lightbox) {
    closeLightbox();
  }
});

document.addEventListener("keydown", function(event) {
  if (lightbox.style.display !== "flex") return;

  if (event.key === "Escape") {
    closeLightbox();
  }

  if (event.key === "ArrowLeft") {
    showPreviousPhoto();
  }

  if (event.key === "ArrowRight") {
    showNextPhoto();
  }
});
    
    // Automatically detect your GitHub username
    // from the GitHub Pages website address.
    const githubUsername = window.location.hostname.split(".")[0];

    const repoName = "civil-line-ganesh-puja";

    const apiUrl =
      `https://api.github.com/repos/${githubUsername}/${repoName}/contents/assets/gallery`;

    fetch(apiUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load gallery photos.");
        }

        return response.json();
      })

      .then(files => {

        gallery.innerHTML = "";

        const imageFiles = files.filter(file =>
          file.type === "file" &&
          /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
        );

        if (imageFiles.length === 0) {
          gallery.innerHTML =
            '<p class="loading">No photos uploaded yet.</p>';
          return;
        }

       imageFiles.forEach((file, index) => {
  const img = document.createElement("img");

  img.src = file.download_url;
  img.alt = "2026 Ganesh Puja event photo";
  img.loading = "lazy";
  img.decoding = "async";

  img.addEventListener("click", () => {
    openLightbox(index);
  });

  gallery.appendChild(img);
});
      })

      .catch(error => {

        console.error(error);

        gallery.innerHTML =
          '<p class="error">Unable to load photos. Please try again later.</p>';

      });
  </script>

</body>
</html>
