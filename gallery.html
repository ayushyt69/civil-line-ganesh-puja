<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2026 Ganesh Puja — Event Gallery</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf0;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 35px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .gallery-grid img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.02);
    }

    .loading {
      text-align: center;
      color: #666;
      margin: 40px 0;
    }

    .error {
      text-align: center;
      color: #c62828;
      margin: 40px 0;
    }

    .lightbox-photo-wrap {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
      max-width:90vw;
      max-height:94vh;
    }

    #lightbox-image {
      display:block;
      max-width:90vw;
      max-height:calc(88vh - 58px);
      width:auto;
      height:auto;
      object-fit:contain;
      border-radius:12px;
    }

    #lightbox-download {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:9px 17px;
      border:1px solid rgba(255,239,190,.8);
      border-radius:999px;
      background:linear-gradient(135deg,#f4d27b,#d6a63e);
      color:#542f0b;
      box-shadow:0 3px 14px rgba(0,0,0,.28);
      font:600 13px Arial,sans-serif;
      letter-spacing:.2px;
      cursor:pointer;
      transition:transform .2s ease, box-shadow .2s ease;
    }

    #lightbox-download:hover {
      transform:translateY(-2px);
      box-shadow:0 5px 18px rgba(214,166,62,.35);
    }

    #lightbox-download:active {
      transform:scale(.97);
    }

    #lightbox-download svg {
      width:16px;
      height:16px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    @media (max-width:600px) {
      .lightbox-photo-wrap { gap:10px; }
      #lightbox-image { max-width:86vw; max-height:calc(82vh - 58px); }
      #lightbox-download { padding:8px 15px; font-size:12px; }
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 35px auto 0;
      padding: 12px 22px;
      background: #d62828;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    /* POLISHED MOBILE TAP AND FOCUS STATES */
    * {
      -webkit-tap-highlight-color: transparent;
    }

    a:focus:not(:focus-visible),
    button:focus:not(:focus-visible) {
      outline: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid #d6a63e;
      outline-offset: 3px;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>2026 Ganesh Puja — Event Gallery</h1>

    <p class="subtitle">
      Memories from our Ganesh Puja celebrations
    </p>

    <div id="event-gallery" class="gallery-grid">
      <p class="loading">Loading photos...</p>
    </div>

<div
  id="lightbox"
  style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
  "
>
  <button
    id="lightbox-close"
    style="
      position:absolute;
      top:18px;
      right:22px;
      background:none;
      border:none;
      color:white;
      font-size:36px;
      cursor:pointer;
      z-index:10001;
    "
    aria-label="Close"
  >
    ×
  </button>

  <button
    id="lightbox-prev"
    style="
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      background:rgba(255,255,255,0.15);
      border:none;
      color:white;
      font-size:34px;
      width:50px;
      height:60px;
      border-radius:10px;
      cursor:pointer;
      z-index:10001;
    "
    aria-label="Previous photo"
  >
    ‹
  </button>

  <div class="lightbox-photo-wrap">
    <img
      id="lightbox-image"
      src=""
      alt="Expanded Ganesh Puja event photo"
    >
    <button id="lightbox-download" type="button" aria-label="Download this photo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/>
      </svg>
      <span>Download Photo</span>
    </button>
  </div>

  <button
    id="lightbox-next"
    style="
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      background:rgba(255,255,255,0.15);
      border:none;
      color:white;
      font-size:34px;
      width:50px;
      height:60px;
      border-radius:10px;
      cursor:pointer;
      z-index:10001;
    "
    aria-label="Next photo"
  >
    ›
  </button>
</div>
    
    <a href="index.html" class="back-button">
      Back to Home
    </a>

  </div>

  <script>
    const gallery = document.getElementById("event-gallery");

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightbox-image");
const lightboxClose = document.getElementById("lightbox-close");
const lightboxPrev = document.getElementById("lightbox-prev");
const lightboxNext = document.getElementById("lightbox-next");
const lightboxDownload = document.getElementById("lightbox-download");

let currentPhotoIndex = 0;
let galleryImages = [];

function openLightbox(index) {
  galleryImages = Array.from(
    document.querySelectorAll("#event-gallery img")
  );

  if (!galleryImages.length) return;

  currentPhotoIndex = index;
  lightboxImage.src = galleryImages[currentPhotoIndex].src;
  lightbox.style.display = "flex";
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  lightbox.style.display = "none";
  document.body.style.overflow = "";
}

function showPreviousPhoto() {
  if (!galleryImages.length) return;

  currentPhotoIndex =
    (currentPhotoIndex - 1 + galleryImages.length) %
    galleryImages.length;

  lightboxImage.src = galleryImages[currentPhotoIndex].src;
}

function showNextPhoto() {
  if (!galleryImages.length) return;

  currentPhotoIndex =
    (currentPhotoIndex + 1) %
    galleryImages.length;

  lightboxImage.src = galleryImages[currentPhotoIndex].src;
}

lightboxClose.addEventListener("click", closeLightbox);

lightboxPrev.addEventListener("click", showPreviousPhoto);

lightboxNext.addEventListener("click", showNextPhoto);

lightboxDownload.addEventListener("click", async function() {
  const imageUrl = lightboxImage.src;
  if (!imageUrl) return;

  const originalLabel = lightboxDownload.innerHTML;
  lightboxDownload.disabled = true;
  lightboxDownload.querySelector("span").textContent = "Preparing...";

  try {
    const response = await fetch(imageUrl);
    if (!response.ok) throw new Error("Download failed");
    const blob = await response.blob();
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const sourceName = galleryImages[currentPhotoIndex]?.src.split("/").pop().split("?")[0];
    link.href = objectUrl;
    link.download = sourceName || "ganesh-puja-photo.jpg";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
  } catch (error) {
    const fallback = document.createElement("a");
    fallback.href = imageUrl;
    fallback.target = "_blank";
    fallback.rel = "noopener";
    fallback.download = "ganesh-puja-photo";
    document.body.appendChild(fallback);
    fallback.click();
    fallback.remove();
  } finally {
    lightboxDownload.disabled = false;
    lightboxDownload.innerHTML = originalLabel;
  }
});

lightbox.addEventListener("click", function(event) {
  if (event.target === lightbox) {
    closeLightbox();
  }
});

document.addEventListener("keydown", function(event) {
  if (lightbox.style.display !== "flex") return;

  if (event.key === "Escape") {
    closeLightbox();
  }

  if (event.key === "ArrowLeft") {
    showPreviousPhoto();
  }

  if (event.key === "ArrowRight") {
    showNextPhoto();
  }
});
    
    // Automatically detect your GitHub username
    // from the GitHub Pages website address.
    const githubUsername = window.location.hostname.split(".")[0];

    const repoName = "civil-line-ganesh-puja";

    const apiUrl =
      `https://api.github.com/repos/${githubUsername}/${repoName}/contents/assets/gallery`;

    fetch(apiUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load gallery photos.");
        }

        return response.json();
      })

      .then(files => {

        gallery.innerHTML = "";

        const imageFiles = files.filter(file =>
          file.type === "file" &&
          /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
        );

        if (imageFiles.length === 0) {
          gallery.innerHTML =
            '<p class="loading">No photos uploaded yet.</p>';
          return;
        }

       imageFiles.forEach((file, index) => {
  const img = document.createElement("img");

  img.src = file.download_url;
  img.alt = "2026 Ganesh Puja event photo";
  img.loading = "lazy";
  img.decoding = "async";

  img.addEventListener("click", () => {
    openLightbox(index);
  });

  gallery.appendChild(img);
});
      })

      .catch(error => {

        console.error(error);

        gallery.innerHTML =
          '<p class="error">Unable to load photos. Please try again later.</p>';

      });
  </script>

</body>
</html>
