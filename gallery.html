<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2026 Ganesh Puja — Event Gallery</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf0;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 35px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .gallery-grid img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.02);
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 35px auto 0;
      padding: 12px 22px;
      background: #d62828;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>2026 Ganesh Puja — Event Gallery</h1>

    <p class="subtitle">
      Memories from our Ganesh Puja celebrations
    </p>

    <div id="event-gallery" class="gallery-grid"></div>

    <a href="index.html" class="back-button">
      Back to Home
    </a>

  </div>

  <script>
    const gallery = document.getElementById("event-gallery");

    const photos = [
      "1789393853394.jpg"
    ];

    photos.forEach(photo => {
      const img = document.createElement("img");

      img.src = "assets/gallery/" + photo;
      img.alt = "2026 Ganesh Puja event photo";

      gallery.appendChild(img);
    });
  </script>

</body>
</html>
