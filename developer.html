<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayush Khaware — Committee Member &amp; Website Developer</title>
<meta name="description" content="Ayush Khaware — Committee Member &amp; Website Developer. Member of the Civil Line Ganesh Puja Samiti and developer of this website.">
<meta name="theme-color" content="#04050d">
<link rel="icon" href="data:,">
<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:#04050d; --ink:#e9edff;
    --cyan:#5cf2ff; --violet:#8b5cff; --pink:#ff4fd8; --amber:#ffb457;
    --sans:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  html,body{overflow-x:hidden}
  body{
    min-height:100vh; min-height:100svh;
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--pink);color:#fff}

  /* ============ BACKDROP LAYERS ============ */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .aurora span{position:absolute;border-radius:50%;will-change:transform}
  .aurora span:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,rgba(139,92,255,.5),transparent 62%);animation:drift1 26s ease-in-out infinite alternate}
  .aurora span:nth-child(2){width:60vmax;height:60vmax;right:-22vmax;bottom:-24vmax;background:radial-gradient(circle,rgba(92,242,255,.32),transparent 62%);animation:drift2 30s ease-in-out infinite alternate}
  .aurora span:nth-child(3){width:46vmax;height:46vmax;right:8vmax;top:-10vmax;background:radial-gradient(circle,rgba(255,79,216,.28),transparent 62%);animation:drift3 34s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-14vmax,-8vmax) scale(1.1)}}
  @keyframes drift3{to{transform:translate(-10vmax,12vmax) scale(1.2)}}

  .floor{
    position:fixed;left:-50%;right:-50%;bottom:-2vh;height:52vh;z-index:0;pointer-events:none;opacity:.5;
    background:
      linear-gradient(rgba(92,242,255,.25) 1px,transparent 1px) 0 0/100% 46px,
      linear-gradient(90deg,rgba(92,242,255,.25) 1px,transparent 1px) 0 0/46px 100%;
    transform:perspective(420px) rotateX(64deg);transform-origin:50% 100%;
    -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 85%);
            mask-image:linear-gradient(to top,#000 0%,transparent 85%);
    animation:floor 2.4s linear infinite;
  }
  @keyframes floor{to{background-position:0 46px,0 0}}

  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}

  .grain{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.08;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .lines{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
  .lines::after{content:"";position:absolute;left:0;right:0;top:-20vh;height:18vh;
    background:linear-gradient(to bottom,transparent,rgba(92,242,255,.06),transparent);animation:sweep 9s linear infinite}
  @keyframes sweep{to{transform:translateY(140vh)}}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.7) 100%)}

  .cg{
    position:fixed;left:0;top:0;width:460px;height:460px;margin:-230px 0 0 -230px;z-index:1;pointer-events:none;opacity:0;will-change:transform;
    background:radial-gradient(circle,rgba(92,242,255,.13),rgba(139,92,255,.09) 38%,transparent 66%);
  }
  @media (pointer:fine){.cg{opacity:1}}

  /* ============ HUD ============ */
  .corner{position:fixed;width:18px;height:18px;z-index:8;border:0 solid rgba(92,242,255,.55);pointer-events:none}
  .corner.tl{top:12px;left:12px;border-top-width:1.5px;border-left-width:1.5px}
  .corner.tr{top:12px;right:12px;border-top-width:1.5px;border-right-width:1.5px}
  .corner.bl{bottom:12px;left:12px;border-bottom-width:1.5px;border-left-width:1.5px}
  .corner.br{bottom:12px;right:12px;border-bottom-width:1.5px;border-right-width:1.5px}

  .hud{position:fixed;top:32px;right:30px;z-index:8;display:flex;gap:18px;align-items:center;
    font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:rgba(210,225,255,.68);pointer-events:none}
  .live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#37ffa3;box-shadow:0 0 10px #37ffa3;margin-right:8px;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}

  .side{position:fixed;right:24px;top:50%;translate:0 -50%;z-index:8;writing-mode:vertical-rl;
    font:500 10px var(--mono);letter-spacing:.42em;text-transform:uppercase;color:rgba(210,225,255,.42);pointer-events:none;display:none}
  @media (min-width:1200px){.side{display:block}}

  /* ============ BACK BUTTON ============ */
  @property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
  @keyframes ang{to{--ang:360deg}}
  .back{
    position:fixed;top:24px;left:26px;z-index:20;display:inline-flex;align-items:center;gap:12px;
    padding:7px 22px 7px 7px;border-radius:999px;color:#fff;text-decoration:none;
    font:600 14px var(--sans);letter-spacing:.02em;border:1.5px solid transparent;
    background:linear-gradient(rgba(8,10,24,.84),rgba(8,10,24,.84)) padding-box,
               conic-gradient(from var(--ang),#5cf2ff,#8b5cff,#ff4fd8,#ffb457,#5cf2ff) border-box;
    animation:ang 5s linear infinite;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    transition:box-shadow .3s,translate .25s ease-out;
  }
  .back .arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#04050d;
    background:linear-gradient(135deg,var(--cyan),var(--violet));transition:transform .3s}
  .back:hover{box-shadow:0 0 34px rgba(92,242,255,.35),0 0 60px rgba(139,92,255,.25)}
  .back:hover .arrow{transform:translateX(-4px)}
  .back:focus-visible{outline:2px solid #fff;outline-offset:4px}

  /* ============ LAYOUT ============ */
  .wrap{
    position:relative;z-index:2;flex:1;width:100%;max-width:1240px;margin:0 auto;
    padding:110px 30px 40px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
    gap:44px;align-items:center;overflow-x:clip;
  }
  .info{max-width:660px}

  .kicker{display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    font:600 11.5px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);
    animation:rise .8s .1s cubic-bezier(.2,.8,.2,1) both}
  .kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 14px var(--pink);animation:blink 1.8s infinite}
  .kicker .sep{width:30px;height:1px;background:linear-gradient(90deg,var(--cyan),transparent)}
  .kicker .muted{color:rgba(210,225,255,.62)}

  .name{margin:22px 0 0;font-family:var(--sans);font-weight:800;text-transform:uppercase;
    line-height:.9;letter-spacing:-.035em;font-size:clamp(2.8rem,7.4vw,6.4rem)}
  .word{display:flex;flex-wrap:nowrap;perspective:700px}
  .lw{display:inline-block;animation:drop 1s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(.2s + var(--g,0) * 60ms)}
  .ltr{display:inline-block;will-change:transform;
    transform:translateY(calc(var(--p,0) * -.08em)) scale(calc(1 + var(--p,0) * .05))}
  .w1 .ltr{color:#fff;text-shadow:0 0 calc(var(--p,0) * 32px) rgba(92,242,255,.85),0 0 calc(var(--p,0) * 70px) rgba(139,92,255,.6)}
  .w2 .ltr{
    color:hsl(calc(185 + var(--i,0) * 18) 100% 72% / calc(.04 + var(--p,0) * .96));
    -webkit-text-stroke:1.5px hsl(calc(185 + var(--i,0) * 18) 100% 70%);
    text-shadow:0 0 calc(var(--p,0) * 34px) hsl(calc(185 + var(--i,0) * 18) 100% 60% / .8);
  }
  @keyframes drop{from{opacity:0;transform:translateY(70%) rotateX(-90deg) scale(.9);filter:blur(8px)}}

  .roles{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:26px 0 28px;animation:rise .9s .7s cubic-bezier(.2,.8,.2,1) both}
  .role{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:10px 15px;border-radius:999px;color:#fff;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);white-space:nowrap}
  .role.r1{border-color:rgba(92,242,255,.5);box-shadow:0 0 22px rgba(92,242,255,.14) inset}
  .role.r2{border-color:rgba(255,180,87,.5);box-shadow:0 0 22px rgba(255,180,87,.12) inset}
  .amp{font:800 22px var(--sans);background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}

  /* ---- bio card ---- */
  .card{position:relative;max-width:620px;border-radius:20px;overflow:hidden;
    background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.12);
    animation:rise .9s .9s cubic-bezier(.2,.8,.2,1) both}
  .card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(360px circle at var(--cx,50%) var(--cy,0%),rgba(92,242,255,.16),transparent 60%)}
  .card:hover::before{opacity:1}
  .card::after{content:"\201C";position:absolute;right:18px;top:34px;font:800 96px/1 Georgia,serif;pointer-events:none;
    background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.16}
  .card-head{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);
    font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(210,225,255,.6)}
  .card-head i{width:9px;height:9px;border-radius:50%}
  .card-head i:nth-child(1){background:var(--pink)}
  .card-head i:nth-child(2){background:var(--amber)}
  .card-head i:nth-child(3){background:var(--cyan)}
  .card-head span{margin-left:8px}
  .bio{position:relative;padding:22px 24px 26px;font-size:clamp(1rem,1.4vw,1.12rem);line-height:1.8;color:#dfe6ff;text-align:left}
  .bio em{font-style:normal;color:var(--cyan);font-weight:600}
  .bio .hl{color:#fff;font-weight:600;background:linear-gradient(90deg,var(--cyan),var(--pink)) 0 100%/0 2px no-repeat;padding-bottom:2px;animation:ul 1.1s 2.3s ease forwards}
  @keyframes ul{to{background-size:100% 2px}}
  .w{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(8px);
    animation:wordIn .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d,0) * 32ms + 1.25s)}
  @keyframes wordIn{to{opacity:1;filter:none;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}}

  /* ============ STAGE / ORBITAL SCENE ============ */
  .stage{display:grid;place-items:center}
  .scene{
    position:relative;width:min(100%,480px,72vh);aspect-ratio:1/1;
    transform:translateY(var(--ty,0px)) perspective(1300px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    animation:sceneIn 1.4s .15s cubic-bezier(.2,.8,.2,1) both;will-change:transform;
  }
  @keyframes sceneIn{from{opacity:0;scale:.8;filter:blur(12px)}}

  .halo{position:absolute;inset:-28%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(139,92,255,.38),rgba(92,242,255,.12) 40%,transparent 66%);animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.08);opacity:.78}}

  .ticks{position:absolute;inset:-3%;border-radius:50%;opacity:.7;
    background:repeating-conic-gradient(rgba(255,255,255,.42) 0 .5deg,transparent .5deg 4deg);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));
    animation:spin 120s linear infinite reverse}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes counter{
    from{transform:rotate(calc(var(--a) * -1))}
    to{transform:rotate(calc(var(--a) * -1 - 360deg))}
  }

  .orbit{position:absolute;border-radius:50%;animation:spin var(--t,40s) linear infinite;animation-direction:var(--dir,normal)}
  .o2{inset:8%;border:1px dashed rgba(255,255,255,.17);--t:48s}
  .o1{inset:17%;border:1px solid rgba(92,242,255,.2);--t:28s;--dir:reverse}
  .slot{position:absolute;inset:0;transform:rotate(var(--a))}
  .sat{position:absolute;top:0;left:50%;width:0;height:0}
  .sat>*{position:absolute;left:0;top:0;translate:-50% -50%;animation:counter var(--t) linear infinite;animation-direction:var(--dir,normal)}
  .chip-o{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;white-space:nowrap;pointer-events:none;
    font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#e6fbff;
    background:rgba(8,10,22,.72);border:1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .chip-o::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .slot:nth-child(2) .chip-o::before{background:var(--pink);box-shadow:0 0 10px var(--pink)}
  .slot:nth-child(3) .chip-o::before{background:var(--amber);box-shadow:0 0 10px var(--amber)}
  .moon{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px rgba(92,242,255,.85)}
  .moon.m2{width:7px;height:7px;background:var(--amber);box-shadow:0 0 12px 3px rgba(255,180,87,.85)}

  /* saturn-style tilted ring (back half behind portrait, front half in front) */
  .tilt{position:absolute;inset:-6%;pointer-events:none;transform:rotate(-16deg) perspective(1100px) rotateX(58deg)}
  .tilt.back{clip-path:inset(-60% -60% 50% -60%)}
  .tilt.front{clip-path:inset(50% -60% -60% -60%)}
  .tilt .rg{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(139,92,255,.6);
    box-shadow:0 0 18px rgba(139,92,255,.38),inset 0 0 18px rgba(139,92,255,.22);animation:spin 18s linear infinite}
  .tilt .rg::before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
    background:var(--pink);box-shadow:0 0 14px 4px rgba(255,79,216,.85)}
  .tilt .rg::after{content:"";position:absolute;bottom:-4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 12px 3px rgba(92,242,255,.85)}

  /* portrait core — ALWAYS a perfect circle */
  .core{position:absolute;inset:26%}
  .core .ring{position:absolute;inset:-9px;border-radius:50%;
    background:conic-gradient(from 0deg,#5cf2ff,#8b5cff,#ff4fd8,#ffb457,#5cf2ff);animation:spin 7s linear infinite}
  .core .ring.blur{filter:blur(16px);opacity:.65}
  .core .gap{position:absolute;inset:-3px;border-radius:50%;background:var(--bg)}
  .core .pulse{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(92,242,255,.6);animation:pulse 3.6s ease-out infinite}
  .core .pulse.p2{animation-delay:1.8s;border-color:rgba(255,79,216,.5)}
  @keyframes pulse{from{transform:scale(1);opacity:.75}to{transform:scale(1.9);opacity:0}}

  .photo{position:absolute;inset:0;border-radius:50%;overflow:hidden;isolation:isolate;background:#0b0e1c;aspect-ratio:1/1}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block;border-radius:50%;user-select:none;-webkit-user-drag:none}
  .photo .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;
    background:radial-gradient(circle at var(--sx,35%) var(--sy,25%),rgba(255,255,255,.34),transparent 52%)}
  .photo .scan{position:absolute;left:0;right:0;top:-25%;height:22%;pointer-events:none;
    background:linear-gradient(to bottom,transparent,rgba(92,242,255,.22),transparent);animation:scan 5s ease-in-out infinite}
  @keyframes scan{0%{top:-25%}55%,100%{top:105%}}
  .photo .fallback{position:absolute;inset:0;display:none;place-items:center;font:800 clamp(2.4rem,9vw,4rem) var(--sans);letter-spacing:-.04em;color:#fff;
    background:radial-gradient(circle at 30% 25%,rgba(139,92,255,.7),rgba(92,242,255,.25) 60%,#0b0e1c)}
  .photo.no-img .fallback{display:grid}

  /* ============ TICKER ============ */
  .ticker{position:relative;z-index:2;overflow:hidden;border-top:1px solid rgba(255,255,255,.08);padding:15px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .track{display:flex;width:max-content;animation:marquee 44s linear infinite}
  .track span{padding-right:3rem;white-space:nowrap;font:500 12px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:rgba(200,215,255,.45)}
  @keyframes marquee{to{transform:translateX(-50%)}}

  /* ============ RESPONSIVE ============ */
  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;padding:96px 22px 34px;gap:28px}
    .stage{order:-1}
    .scene{width:min(80vw,400px)}
    .info{text-align:center;margin:0 auto}
    .kicker,.roles{justify-content:center}
    .name{font-size:clamp(3rem,16.5vw,6.2rem)}
    .word{justify-content:center}
    .card{margin-inline:auto}
  }
  @media (max-width:600px){
    .hud .coords{display:none}
    .hud{top:36px;right:22px}
    .back{top:22px;left:20px;font-size:13px}
    .chip-o{font-size:8.5px;padding:5px 8px;gap:5px}
    .role{font-size:10.5px;padding:8px 11px}
    .kicker{font-size:10px;letter-spacing:.16em}
    .bio{padding:20px 20px 24px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    .w{opacity:1;filter:none;transform:none}
  }
</style>
</head>
<body>

  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="floor" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="lines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="cg" id="cg" aria-hidden="true"></div>

  <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i>
  <i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>

  <a class="back" id="back" href="index.html">
    <span class="arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    </span>
    <span>Back to Home</span>
  </a>

  <div class="hud" aria-hidden="true">
    <span class="live"><i></i>Live</span>
    <span class="coords" id="coords">X 0000 · Y 0000</span>
  </div>
  <div class="side" aria-hidden="true">Digitally preserving our celebrations</div>

  <main class="wrap">
    <section class="info">
      <p class="kicker">
        <span class="dot" aria-hidden="true"></span>
        <span data-scr>Developer Profile</span>
        <span class="sep" aria-hidden="true"></span>
        <span class="muted" data-scr>Civil Line Ganesh Puja Samiti</span>
      </p>

      <h1 class="name" aria-label="Ayush Khaware">
        <span class="word w1">AYUSH</span>
        <span class="word w2">KHAWARE</span>
      </h1>

      <div class="roles">
        <span class="role r1" data-scr>Committee Member</span>
        <span
